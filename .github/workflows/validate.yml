name: Validate distribution
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    name: Source and package checks (no SDK execution)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 tools/check_dist.py
      - run: python3 -m unittest discover -s tests -v
      - run: python3 -m unittest discover -s viewer -p 'test_server.py' -v
      - run: node --check viewer/app.js
      - run: python3 tools/package.py
      - name: Verify archive checksums
        working-directory: dist
        run: shasum -a 256 -c SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: distribution-preview
          path: |
            dist/insta360-ai-toolkit-*.zip
            dist/insta360-sdk-*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
